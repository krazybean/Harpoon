[package]
name = "harpoon-desktop"
version = "2.0.0-rc.1"
description = "Harpoon desktop UI — client of Harpoon runtime"
authors = ["Harpoon"]
edition = "2021"
repository = "https://github.com/harpoon"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri = { version = "=2.12.2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
