[package]
name = "harpoon-desktop"
version = "0.1.0"
description = "Harpoon desktop UI — client of Harpoon runtime"
authors = ["Harpoon"]
edition = "2021"
repository = "https://github.com/harpoon"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
