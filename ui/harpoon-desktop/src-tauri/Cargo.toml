[package]
name = "harpoon-desktop"
version = "2.0.0-rc.4"
description = "Harpoon desktop UI — client of Harpoon runtime"
authors = ["Harpoon"]
edition = "2021"
repository = "https://github.com/harpoon"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri = { version = "=2.12.1", features = [] }
harpoon-deploy = { path = "../../../deploy" }
harpoon-deploy-journal = { path = "../../../deploy-journal" }
harpoon-deploy-cli = { path = "../../../deploy-cli" }
harpoon-deploy-docker = { path = "../../../deploy-docker" }
harpoon-deploy-keychain = { path = "../../../deploy-keychain" }

# the same crates the web view already links; used to snapshot a deployed page (see preview.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSValue", "NSString", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSWindow", "NSResponder", "NSGraphics"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Xcode 27's ld emits proc-macro dylibs that dyld refuses to load ("mis-aligned LINKEDIT string pool")
# when chained fixups (any MACOSX_DEPLOYMENT_TARGET >= 12, which Tauri exports) meet rustc's default
# debuginfo strip, so every universal/arm64 release build died with E0463. Build-time-only: shipped binaries keep release stripping.
[profile.release.build-override]
strip = "none"
