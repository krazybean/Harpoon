name: Universal macOS DMG

# Builds an unsigned (ad-hoc) universal Harpoon.app (arm64 + x86_64) and
# uploads Harpoon-<version>-universal.dmg as a workflow artifact.
# Developer ID signing and notarization stay with tools/release/macos/release.sh.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/universal-dmg.yml
      - harpoon/build.sh
      - harpoon/Sources/**
      - tools/guest-builder/**
      - tools/release/**
      - tools/verify-bundle.sh
      - ui/harpoon-desktop/src-tauri/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal-dmg:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HARPOON_ARCH: universal
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/harpoon-desktop/package-lock.json

      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install desktop dependencies
        run: npm --prefix ui/harpoon-desktop ci

      - name: Build universal Swift runtime
        run: |
          sh harpoon/build.sh
          lipo harpoon/build/harpoon -verify_arch arm64 x86_64

      - name: Install guest tooling
        run: |
          brew install squashfs e2fsprogs
          echo "$(brew --prefix e2fsprogs)/sbin" >> "$GITHUB_PATH"
          softwareupdate --install-rosetta --agree-to-license || true

      # TEMPORARY: record the x86_64 Alpine pins for tools/guest-builder/guest-arch.sh.
      - name: Print x86_64 guest pins
        run: |
          base=https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64
          for f in netboot/vmlinuz-virt netboot/initramfs-virt netboot/modloop-virt alpine-minirootfs-3.22.1-x86_64.tar.gz; do
            curl -sSL --fail -o "$RUNNER_TEMP/pin" "$base/$f"
            echo "PIN $f $(shasum -a 256 "$RUNNER_TEMP/pin" | cut -d' ' -f1)"
            [ "$f" = netboot/vmlinuz-virt ] && echo "PIN kernel $(file -b "$RUNNER_TEMP/pin")"
            [ "$f" = netboot/modloop-virt ] && echo "PIN modloop $(unsquashfs -l "$RUNNER_TEMP/pin" | grep -m1 -o 'modules/[^/]*-virt')"
            true
          done

      # Kernel, initramfs and root images for both guests (aarch64 in assets/guest,
      # x86_64 in assets/guest/x86_64). Roots and the x86_64 initramfs need
      # Virtualization.framework, Rosetta and Docker, so when the repository variables
      # HARPOON_GUEST_ASSETS_URL and HARPOON_GUEST_ASSETS_SHA256 are set, the tarball
      # from tools/guest-builder/pack-assets.sh is used instead of building them here.
      - name: Obtain guest assets
        env:
          ASSETS_URL: ${{ vars.HARPOON_GUEST_ASSETS_URL }}
          ASSETS_SHA256: ${{ vars.HARPOON_GUEST_ASSETS_SHA256 }}
        run: |
          if [ -n "$ASSETS_URL" ]; then
            curl -L --fail -o "$RUNNER_TEMP/guest-assets.tar.gz" "$ASSETS_URL"
            echo "$ASSETS_SHA256  $RUNNER_TEMP/guest-assets.tar.gz" | shasum -a 256 -c -
            tar -xzf "$RUNNER_TEMP/guest-assets.tar.gz" -C assets/guest
          else
            bash tools/guest-builder/fetch-kernel.sh
            bash tools/guest-builder/guest-assets-manifest.sh --write
            bash tools/guest-builder/build-root.sh --builder vz --force
            HARPOON_GUEST_ARCH=x86_64 bash tools/guest-builder/build.sh
          fi
          for arch in aarch64 x86_64; do
            HARPOON_GUEST_ARCH=$arch bash tools/guest-builder/guest-assets-manifest.sh --verify
            HARPOON_GUEST_ARCH=$arch bash tools/guest-builder/verify-root.sh "$(HARPOON_GUEST_ARCH=$arch sh -c '. tools/guest-builder/guest-arch.sh; guest_asset_dir assets/guest')/harpoon-root.img"
          done

      - name: Build universal Harpoon.app
        run: |
          bash ui/harpoon-desktop/src-tauri/prepare-bundle.sh
          node ui/harpoon-desktop/scripts/version.mjs --check
          npm --prefix ui/harpoon-desktop run tauri -- build --bundles app --target universal-apple-darwin

      - name: Ad-hoc sign and verify bundle
        run: |
          APP=ui/harpoon-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Harpoon.app
          sh ui/harpoon-desktop/scripts/sign-app.sh "$APP"
          bash tools/verify-bundle.sh "$APP"

      - name: Build DMG
        run: |
          VERSION="$(node -p "require('./ui/harpoon-desktop/package.json').version")"
          bash tools/release/macos/build-dmg.sh "$VERSION"
          ls -lh dist/v"$VERSION"/Harpoon-"$VERSION"-universal.dmg
          echo "DMG_PATH=dist/v$VERSION/Harpoon-$VERSION-universal.dmg" >> "$GITHUB_ENV"

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harpoon-universal-dmg
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error
          retention-days: 14
