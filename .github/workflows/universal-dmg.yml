name: Universal macOS DMG

# Builds an unsigned (ad-hoc) universal Harpoon.app (arm64 + x86_64) and
# uploads Harpoon-<version>-universal.dmg as a workflow artifact.
# Developer ID signing and notarization stay with tools/release/macos/release.sh.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/universal-dmg.yml
      - harpoon/build.sh
      - harpoon/Sources/**
      - tools/release/macos/**
      - tools/verify-bundle.sh
      - ui/harpoon-desktop/src-tauri/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal-dmg:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HARPOON_ARCH: universal
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/harpoon-desktop/package-lock.json

      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install desktop dependencies
        run: npm --prefix ui/harpoon-desktop ci

      - name: Build universal Swift runtime
        run: |
          sh harpoon/build.sh
          lipo harpoon/build/harpoon -verify_arch arm64 x86_64

      - name: Fetch guest kernel
        run: |
          bash tools/guest-builder/fetch-kernel.sh
          bash tools/guest-builder/guest-assets-manifest.sh --write

      # The root image is normally built by the disposable VZ builder, which needs
      # Virtualization.framework inside the runner. When the repository variables
      # HARPOON_ROOT_IMG_URL and HARPOON_ROOT_IMG_SHA256 are set, a prebuilt
      # tar.gz holding harpoon-root.img and harpoon-root.img.manifest is used instead
      # (create it with: tar -czf harpoon-root.tar.gz -C assets/guest harpoon-root.img harpoon-root.img.manifest).
      - name: Obtain guest root image
        env:
          ROOT_URL: ${{ vars.HARPOON_ROOT_IMG_URL }}
          ROOT_SHA256: ${{ vars.HARPOON_ROOT_IMG_SHA256 }}
        run: |
          if [ -n "$ROOT_URL" ]; then
            curl -L --fail -o "$RUNNER_TEMP/harpoon-root.tar.gz" "$ROOT_URL"
            echo "$ROOT_SHA256  $RUNNER_TEMP/harpoon-root.tar.gz" | shasum -a 256 -c -
            tar -xzf "$RUNNER_TEMP/harpoon-root.tar.gz" -C assets/guest harpoon-root.img harpoon-root.img.manifest
            bash tools/guest-builder/verify-root.sh assets/guest/harpoon-root.img
          else
            bash tools/guest-builder/build-root.sh --builder vz --force
          fi

      - name: Build universal Harpoon.app
        run: |
          bash ui/harpoon-desktop/src-tauri/prepare-bundle.sh
          node ui/harpoon-desktop/scripts/version.mjs --check
          npm --prefix ui/harpoon-desktop run tauri -- build --bundles app --target universal-apple-darwin

      - name: Ad-hoc sign and verify bundle
        run: |
          APP=ui/harpoon-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Harpoon.app
          sh ui/harpoon-desktop/scripts/sign-app.sh "$APP"
          bash tools/verify-bundle.sh "$APP"

      - name: Build DMG
        run: |
          VERSION="$(node -p "require('./ui/harpoon-desktop/package.json').version")"
          bash tools/release/macos/build-dmg.sh "$VERSION"
          ls -lh dist/v"$VERSION"/Harpoon-"$VERSION"-universal.dmg
          echo "DMG_PATH=dist/v$VERSION/Harpoon-$VERSION-universal.dmg" >> "$GITHUB_ENV"

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harpoon-universal-dmg
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error
          retention-days: 14
