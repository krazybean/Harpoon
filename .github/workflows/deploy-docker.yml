name: Deploy Docker backend

# Milestone B3. Runs the Docker backend's tests against a fake Docker on a test-owned Unix socket
# and a fake Buildx script. It never contacts a real Docker endpoint and never builds an image.
# Isolated from the desktop/DMG pipelines: runs only when these crates or this file change.

on:
  push:
    branches:
      - main
    paths:
      - "deploy-docker/**"
      - "deploy/**"
      - ".github/workflows/deploy-docker.yml"
  pull_request:
    branches:
      - main
    paths:
      - "deploy-docker/**"
      - "deploy/**"
      - ".github/workflows/deploy-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo --version

      - name: No registry dependencies, no live-socket references
        run: |
          # Only the path dependency on the engine crate is allowed.
          deps="$(awk '/^\[dependencies\]/{f=1;next} /^\[/{f=0} f && NF && $1 !~ /^#/' Cargo.toml)"
          if [ "$deps" != 'harpoon-deploy = { path = "../deploy" }' ]; then
            echo "unexpected dependencies in deploy-docker/Cargo.toml:" >&2; echo "$deps" >&2; exit 1
          fi
          live='/tmp/harpoon-docker''.sock'
          if grep -rnF "$live" src tests; then
            echo "the live Harpoon socket must never appear in this crate" >&2; exit 1
          fi
          if grep -rnE '/(system|containers|images|volumes|networks|builder)/prune|DOCKER_HOST"|docker buildx|Command::new\("docker' src; then
            echo "pruning, environment sockets and non-bundled docker invocations are out of scope" >&2; exit 1
          fi

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --offline --all-targets -- -D warnings

      - name: Tests
        run: cargo test --offline
