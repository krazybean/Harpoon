name: Deploy keychain

# Milestone C. The macOS Keychain adapter for deployment secrets. The default tests are pure (status
# mapping, the non-macOS stub) and run on Linux; the real-Keychain round trip is #[ignore] and runs only
# when someone asks, on a Mac, against disposable items. Nothing here uses Docker, a VM or the network.

on:
  push:
    branches:
      - main
    paths:
      - "deploy-keychain/**"
      - "deploy/**"
      - ".github/workflows/deploy-keychain.yml"
  pull_request:
    branches:
      - main
    paths:
      - "deploy-keychain/**"
      - "deploy/**"
      - ".github/workflows/deploy-keychain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-keychain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy-keychain
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo --version

      - name: Only the engine crate as a dependency; no process, network or command-line secret handling
        run: |
          deps="$(awk '/^\[dependencies\]/{f=1;next} /^\[/{f=0} f && NF && $1 !~ /^#/' Cargo.toml)"
          if [ "$deps" != 'harpoon-deploy = { path = "../deploy" }' ]; then
            echo "unexpected dependencies in deploy-keychain/Cargo.toml:" >&2; echo "$deps" >&2; exit 1
          fi
          # A secret must never travel on a command line or through a shell: Security.framework only.
          if grep -rnE 'std::process::(Command|Stdio)|Command::new|std::net|UnixStream|env::var|security (add|find|delete)' src | grep -vE ':[0-9]+:[[:space:]]*//'; then
            echo "the Keychain adapter calls Security.framework directly: no process, shell or network" >&2; exit 1
          fi

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --offline --all-targets -- -D warnings

      - name: Tests (pure; the real-Keychain test is ignored)
        run: cargo test --offline
