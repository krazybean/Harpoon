name: published-ports

on:
  pull_request:
    paths:
      - harpoon/Sources/PortForwardManager.swift
      - harpoon/Sources/PortForwardBridge.swift
      - harpoon/regression-published-port-route.swift
      - harpoon/regression-published-port-route.sh
      - .github/workflows/published-ports.yml
  push:
    branches: [main]
    paths:
      - harpoon/Sources/PortForwardManager.swift
      - harpoon/Sources/PortForwardBridge.swift
      - harpoon/regression-published-port-route.swift
      - harpoon/regression-published-port-route.sh

permissions:
  contents: read

jobs:
  published-ports:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Route selection (guest address vs guest loopback) and the guest relay commands, run for real against
      # shimmed guest tools. No VM, no Docker. The live end-to-end test (regression-loopback-publish.sh) needs an
      # isolated engine and is run by hand.
      - name: Published-port routing and guest relay commands
        run: sh harpoon/regression-published-port-route.sh
